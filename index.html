<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Football Tracker</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--hc:#c2185b;--ac:#1e88e5}
body{font-family:-apple-system,Arial,sans-serif;background:#f0f2f5;padding:12px;-webkit-user-select:none;user-select:none}
.c{max-width:440px;margin:0 auto}
h1{text-align:center;font-size:1.3em;margin:8px 0 16px;color:#333}
.sec{background:#fff;border-radius:12px;padding:14px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.sec h2{font-size:.85em;color:#888;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
#timer{font-size:2.2em;font-family:monospace;text-align:center;display:block;padding:6px 0;color:#111;font-weight:bold}
#htLabel{text-align:center;font-size:1em;color:#666;margin-bottom:4px;font-weight:bold}
#nsLabel{text-align:center;font-size:.85em;color:#e65100;font-weight:bold;margin-top:2px;min-height:1.2em}
#btnStart{display:block;width:100%;padding:14px;border:none;border-radius:10px;background:#2e7d32;color:#fff;font-size:1.15em;font-weight:bold;cursor:pointer;text-align:center;margin-top:6px}
#btnStart.run{background:#e65100}
#btnStart.pau{background:#1976d2}
.ti{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:.9em;margin-bottom:6px;-webkit-user-select:text;user-select:text}
.tm{width:80px;padding:8px;border:1px solid #ddd;border-radius:8px;font-size:1em;text-align:center;font-weight:bold}
.cr{display:flex;align-items:center;gap:8px;margin-top:6px}
.cr label{font-size:.8em;color:#777}
.cr input[type=color]{width:36px;height:28px;border:none;border-radius:6px}
.tmr{display:flex;align-items:center;gap:8px;justify-content:center;margin-bottom:6px}
.rw{display:flex;align-items:center;gap:4px;margin-bottom:2px;flex-wrap:nowrap}
.rl{flex:1;font-size:.9em;color:#444;font-weight:600;white-space:nowrap}
.rc{font-family:monospace;font-size:1.4em;min-width:28px;text-align:center;font-weight:bold;color:#222;line-height:1;vertical-align:middle}
.bh{background:var(--hc);color:#fff;border:none;border-radius:6px;padding:8px 6px;font-size:.95em;font-weight:bold;cursor:pointer;flex:none;min-width:48px}
.ba{background:var(--ac);color:#fff;border:none;border-radius:8px;padding:12px 0;font-size:1em;font-weight:bold;cursor:pointer;flex:.9}
.bu{background:#eee;color:#999;border:none;border-radius:6px;padding:7px 0;font-size:.9em;font-weight:bold;cursor:pointer;width:50%;margin:3px auto;display:block}
.bu:active{background:#ccc;color:#666}
.bx{background:#78909c;color:#fff;border:none;border-radius:8px;padding:12px;font-size:1em;font-weight:bold;cursor:pointer;width:100%;margin-top:4px}
.be{background:#1565c0;color:#fff;border:none;border-radius:8px;padding:12px;font-size:1em;font-weight:bold;cursor:pointer;width:100%;margin-top:6px}
.gl{font-size:.7em;color:#999;margin-top:6px;padding-top:4px;border-top:1px solid #f0f0f0}
.gi{padding:2px 0}
.hd{display:none}
</style>
</head>
<body>
<div class="c">
<h1>Football Tracker</h1>
<div class="sec">
<div id="htLabel">1. Halbzeit</div>
<div id="timer">00:00</div>
<div id="nsLabel"></div>
<div class="tmr" id="tRow"><label>Minuten:</label><input class="tm" id="hM" type="number" value="45" min="5" max="120"></div>
<button id="btnStart" type="button" onclick="tA()">Start</button>
</div>
<div class="sec">
<h2>Teams</h2>
<input class="ti" id="tH" type="text" placeholder="Heim" oninput="sN()">
<input class="ti" id="tA" type="text" placeholder="Auswaerts" oninput="sN()">
<div class="cr"><label>Heim:</label><input type="color" id="cH" value="#c2185b" onchange="sC()"><label>Ausw:</label><input type="color" id="cA" value="#1e88e5" onchange="sC()"></div>
</div>
<div class="sec"><h2>Tore</h2>
<div class="rw"><span class="rl lH">Heim</span><span class="rc" id="hg">0</span><button class="bh" type="button" onclick="c('hg',1)">+Tor</button><button class="ba" type="button" onclick="c('ag',1)">+Tor</button></div>
<div class="rw"><span class="rl lA">Auswaerts</span><span class="rc" id="ag">0</span></div>
<button class="bu" type="button" onclick="uZ()">&#8617; Undo</button><div class="gl" id="gl"></div></div>
<div class="sec"><h2>Schuesse a.Tor</h2>
<div class="rw"><span class="rl lH">Heim</span><span class="rc" id="hst">0</span><button class="bh" type="button" onclick="c('hst')">+</button><button class="ba" type="button" onclick="c('ast')">+</button></div>
<div class="rw"><span class="rl lA">Auswaerts</span><span class="rc" id="ast">0</span></div>
<button class="bu" type="button" onclick="uZ()">&#8617; Undo</button></div>
<div class="sec"><h2>Schuesse vorbei</h2>
<div class="rw"><span class="rl lH">Heim</span><span class="rc" id="hsb">0</span><button class="bh" type="button" onclick="c('hsb')">+</button><button class="ba" type="button" onclick="c('asb')">+</button></div>
<div class="rw"><span class="rl lA">Auswaerts</span><span class="rc" id="asb">0</span></div>
<button class="bu" type="button" onclick="uZ()">&#8617; Undo</button></div>
<div class="sec"><h2>Ecken</h2>
<div class="rw"><span class="rl lH">Heim</span><span class="rc" id="he">0</span><button class="bh" type="button" onclick="c('he')">+</button><button class="ba" type="button" onclick="c('ae')">+</button></div>
<div class="rw"><span class="rl lA">Auswaerts</span><span class="rc" id="ae">0</span></div>
<button class="bu" type="button" onclick="uZ()">&#8617; Undo</button></div>
<div class="sec"><h2>Freistoesse</h2>
<div class="rw"><span class="rl lH">Heim</span><span class="rc" id="hf">0</span><button class="bh" type="button" onclick="c('hf')">+</button><button class="ba" type="button" onclick="c('af')">+</button></div>
<div class="rw"><span class="rl lA">Auswaerts</span><span class="rc" id="af">0</span></div>
<button class="bu" type="button" onclick="uZ()">&#8617; Undo</button></div>
<div class="sec"><h2>Gelb</h2>
<div class="rw"><span class="rl lH">Heim</span><span class="rc" id="hy">0</span><button class="bh" type="button" onclick="c('hy')">+</button><button class="ba" type="button" onclick="c('ay')">+</button></div>
<div class="rw"><span class="rl lA">Auswaerts</span><span class="rc" id="ay">0</span></div>
<button class="bu" type="button" onclick="uZ()">&#8617; Undo</button></div>
<div class="sec"><h2>Rot</h2>
<div class="rw"><span class="rl lH">Heim</span><span class="rc" id="hr">0</span><button class="bh" type="button" onclick="c('hr')">+</button><button class="ba" type="button" onclick="c('ar')">+</button></div>
<div class="rw"><span class="rl lA">Auswaerts</span><span class="rc" id="ar">0</span></div>
<button class="bu" type="button" onclick="uZ()">&#8617; Undo</button></div>
<div class="sec">
<button class="bx" type="button" onclick="rA()">Alles zuruecksetzen</button>
<button class="be" type="button" onclick="eC()">CSV Export</button>
</div>
</div>
<script>
var mo='idle',tI=null,sec=0,hm=45,hn=1,nsR=false,nsS=0;
var cs={hg:0,ag:0,hst:0,ast:0,hsb:0,asb:0,he:0,ae:0,hf:0,af:0,hy:0,ay:0,hr:0,ar:0};
var gl=[];
function ft(n){return String(Math.floor(n/3600)).padStart(2,'0')+':'+String(Math.floor((n%3600)/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');}
function tA(){var b=document.getElementById('btnStart'),l=document.getElementById('htLabel');
if(mo==='idle'){hm=parseInt(document.getElementById('hM').value)||45;if(hm<5)hm=5;document.getElementById('hM').value=hm;sec=hm*60;nsR=false;nsS=0;uT();l.textContent=hn===1?'1. Halbzeit':'2. Halbzeit';document.getElementById('nsLabel').textContent='';mo='run';b.textContent='Stop';b.className='run';document.getElementById('tRow').className='tmr hd';tI=setInterval(function(){sec--;uT();if(sec===0)hE();},1000);}
else if(mo==='run'){clearInterval(tI);mo='pau';b.textContent='Weiter';b.className='pau';}
else if(mo==='pau'){mo='run';b.textContent='Stop';b.className='run';tI=setInterval(function(){sec--;uT();if(sec===0)hE();},1000);}
else if(mo==='ns'){mo='ht';nsR=false;if(hn===1){b.textContent='2. Halbzeit starten';l.textContent='Halbzeit';b.className='';}else{b.textContent='Spiel beendet';l.textContent='Spiel beendet';b.className='';}document.getElementById('nsLabel').textContent='+ '+ft(nsS);}
else if(mo==='ht'){hn=2;nsS=0;sec=hm*60;uT();l.textContent='2. Halbzeit';document.getElementById('nsLabel').textContent='';mo='run';b.textContent='Stop';b.className='run';document.getElementById('tRow').className='tmr hd';tI=setInterval(function(){sec--;uT();if(sec===0)hE();},1000);}}
function hE(){clearInterval(tI);mo='ns';nsR=true;nsS=0;var b=document.getElementById('btnStart');b.textContent='Nachspielzeit stoppen';b.className='';b.style.background='#d32f2f';document.getElementById('htLabel').textContent='ZEIT ABGELAUFEN!';document.getElementById('nsLabel').textContent='Nachspielzeit +';tI=setInterval(function(){nsS++;uT();},1000);}
function uT(){document.getElementById('timer').textContent=ft(sec);if(nsR&&nsS>0)document.getElementById('nsLabel').textContent='Nachspielzeit +'+ft(nsS);}
function c(id,ig){cs[id]++;document.getElementById(id).textContent=cs[id];if(ig){gl.push({t:ft(sec),n:(id==='hg')?(document.getElementById('tH').value||'Heim'):(document.getElementById('tA').value||'Auswaerts'),c:cs[id]});rG();}sV();}
function uZ(){var k=['hg','ag','hst','ast','hsb','asb','he','ae','hf','af','hy','ay','hr','ar'];for(var i=k.length-1;i>=0;i--){if(cs[k[i]]>0){cs[k[i]]--;document.getElementById(k[i]).textContent=cs[k[i]];if(k[i]==='hg'||k[i]==='ag'){gl.pop();rG();}sV();break;}}}
function rG(){var h='';for(var i=0;i<gl.length;i++)h+='<div class="gi">'+gl[i].t+' - '+gl[i].n+' (Tor '+gl[i].c+')</div>';document.getElementById('gl').innerHTML=h;}
function sV(){try{localStorage.setItem('fc',JSON.stringify(cs));localStorage.setItem('fg',JSON.stringify(gl));}catch(e){}}
function sN(){uD();try{localStorage.setItem('fh',document.getElementById('tH').value);localStorage.setItem('fa',document.getElementById('tA').value);}catch(e){}}
function sC(){aC();try{localStorage.setItem('fch',document.getElementById('cH').value);localStorage.setItem('fca',document.getElementById('cA').value);}catch(e){}}
function aC(){document.documentElement.style.setProperty('--hc',document.getElementById('cH').value);document.documentElement.style.setProperty('--ac',document.getElementById('cA').value);}
function uD(){var h=document.getElementById('tH').value||'Heim',a=document.getElementById('tA').value||'Auswaerts';var eH=document.querySelectorAll('.lH');for(var i=0;i<eH.length;i++)eH[i].textContent=h;var eA=document.querySelectorAll('.lA');for(var i=0;i<eA.length;i++)eA[i].textContent=a;}
function rA(){if(!confirm('Wirklich alles zuruecksetzen?'))return;sec=0;hn=1;mo='idle';clearInterval(tI);tI=null;nsR=false;nsS=0;cs={hg:0,ag:0,hst:0,ast:0,hsb:0,asb:0,he:0,ae:0,hf:0,af:0,hy:0,ay:0,hr:0,ar:0};gl=[];var k=['hg','ag','hst','ast','hsb','asb','he','ae','hf','af','hy','ay','hr','ar'];for(var i=0;i<k.length;i++)document.getElementById(k[i]).textContent='0';document.getElementById('timer').textContent='00:00';document.getElementById('htLabel').textContent='1. Halbzeit';document.getElementById('nsLabel').textContent='';var b=document.getElementById('btnStart');b.textContent='Start';b.className='';b.style.background='#2e7d32';document.getElementById('tRow').className='tmr';sV();}
function eC(){var hN=document.getElementById('tH').value||'Heim',aN=document.getElementById('tA').value||'Auswaerts';var csv='Kategorie,'+hN+','+aN+'\nTore,'+cs.hg+','+cs.ag+'\nSchuesse a.Tor,'+cs.hst+','+cs.ast+'\nSchuesse vorbei,'+cs.hsb+','+cs.asb+'\nEcken,'+cs.he+','+cs.ae+'\nFreistoesse,'+cs.hf+','+cs.af+'\nGelb,'+cs.hy+','+cs.ay+'\nRot,'+cs.hr+','+cs.ar+'\n\nTor-Protokoll:\nZeit,Team,Tor-Nr\n';for(var i=0;i<gl.length;i++){csv+=gl[i].t+','+gl[i].n+','+gl[i].c+'\n';}var bl=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'});var lnk=document.createElement('a');lnk.href=URL.createObjectURL(bl);var d=new Date();lnk.download='spiel_'+d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+'.csv';document.body.appendChild(lnk);lnk.click();document.body.removeChild(lnk);URL.revokeObjectURL(lnk.href);}
function load(){try{var sc=localStorage.getItem('fc');if(sc){cs=JSON.parse(sc);for(var k in cs){var el=document.getElementById(k);if(el)el.textContent=cs[k];}}var sg=localStorage.getItem('fg');if(sg){gl=JSON.parse(sg);rG();}var hn2=localStorage.getItem('fh');if(hn2)document.getElementById('tH').value=hn2;var an=localStorage.getItem('fa');if(an)document.getElementById('tA').value=an;var ch=localStorage.getItem('fch');if(ch)document.getElementById('cH').value=ch;var ca=localStorage.getItem('fca');if(ca)document.getElementById('cA').value=ca;}catch(e){}aC();uD();}
load();
</script>
</body>
</html>
