.c{max-width:460px;margin:0 auto;text-align:center}
h1{text-align:center;font-size:1.3em;margin:8px 0 16px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.sec{background:rgba(255,255,255,.92);border-radius:12px;padding:14px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.sec h2{font-size:.85em;color:#888;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
#timerWrap{display:flex;justify-content:center;align-items:baseline;gap:8px;flex-wrap:wrap}
#timer{font-size:2.3em;font-family:monospace;text-align:center;display:block;padding:6px 0;color:#111;font-weight:bold}
#htLabel{text-align:center;font-size:1em;color:#666;margin-bottom:4px;font-weight:bold}
#nsLabel{text-align:center;font-size:1.05em;color:#e65100;font-weight:bold;min-height:1.3em;font-family:monospace}
#btnStart{display:block;width:100%;padding:14px;border:none;border-radius:10px;background:#2e7d32;color:#fff;font-size:1.15em;font-weight:bold;cursor:pointer;text-align:center;margin-top:6px}
#btnStart.run{background:#e65100}
#btnStart.pau{background:#1976d2}
#btnStart.ns{background:#d32f2f}
#btnStart.next{background:#6a1b9a}
#btnStart.done{background:#455a64}
.teamRow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.ti{flex:1;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:.9em;-webkit-user-select:text;user-select:text}
.tc{width:42px;height:40px;border:none;border-radius:8px;background:#fff;cursor:pointer}
.tm{width:80px;padding:8px;border:1px solid #ddd;border-radius:8px;font-size:1em;text-align:center;font-weight:bold}
.tmr{display:flex;align-items:center;gap:8px;justify-content:center;margin-bottom:6px}
.rw{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:6px;flex-wrap:nowrap}
.rc{font-family:monospace;font-size:1.4em;min-width:34px;text-align:center;font-weight:bold;color:#222;line-height:1;background:#fff;border-radius:6px;padding:2px 4px;box-shadow:inset 0 1px 3px rgba(0,0,0,.1)}
.bh,.ba{background:var(--hc);color:#fff;border:none;border-radius:6px;padding:10px 24px;font-size:1em;font-weight:bold;cursor:pointer;flex:none;min-width:88px;height:44px}
.ba{background:var(--ac)}
.bu{background:#eee;color:#999;border:none;border-radius:6px;padding:6px 0;font-size:.8em;font-weight:bold;cursor:pointer;width:40%;margin:2px auto 0;display:block}
.bu:active{background:#ccc;color:#666}
.bx{background:#78909c;color:#fff;border:none;border-radius:8px;padding:12px;font-size:1em;font-weight:bold;cursor:pointer;width:100%;margin-top:4px}
.be{background:#1565c0;color:#fff;border:none;border-radius:8px;padding:12px;font-size:1em;font-weight:bold;cursor:pointer;width:100%;margin-top:6px}
.log{font-size:.72em;color:#666;margin-top:8px;padding-top:6px;border-top:1px solid #f0f0f0;text-align:left}
.log:empty{display:none}
.logItem{padding:2px 0}
.hd{display:none}
</style>
</head>
<body>
<div class="c">
<h1>Football Tracker</h1>

<div class="sec">
<div id="htLabel">1. Halbzeit</div>
<div id="timerWrap">
  <div id="timer">00:00</div>
  <div id="nsLabel"></div>
</div>
<div class="tmr" id="tRow"><label>Minuten:</label><input class="tm" id="hM" type="number" value="45" min="1" max="120"></div>
<button id="btnStart" type="button" onclick="tA()">Start</button>
</div>

<div class="sec">
<h2>Teams</h2>
<div class="teamRow"><input class="ti" id="tH" type="text" placeholder="Heimmannschaft" oninput="saveTeamNames()"><input class="tc" type="color" id="cH" value="#c2185b" onchange="applyColors()"></div>
<div class="teamRow"><input class="ti" id="tAName" type="text" placeholder="Auswaertsmannschaft" oninput="saveTeamNames()"><input class="tc" type="color" id="cA" value="#1e88e5" onchange="applyColors()"></div>
</div>

<div class="sec"><h2>Tore</h2>
<div class="rw"><span class="rc" id="hg">0</span><button class="bh" type="button" onclick="c('hg',1,'goals')">+</button><button class="ba" type="button" onclick="c('ag',1,'goals')">+</button><span class="rc" id="ag">0</span></div>
<button class="bu" type="button" onclick="uZ()">&#8617; Undo</button><div class="log" id="log_goals"></div></div>

<div class="sec"><h2>Schuesse aufs Tor</h2>
<div class="rw"><span class="rc" id="hst">0</span><button class="bh" type="button" onclick="c('hst',1,'shotsOnTarget')">+</button><button class="ba" type="button" onclick="c('ast',1,'shotsOnTarget')">+</button><span class="rc" id="ast">0</span></div>
<button class="bu" type="button" onclick="uZ()">&#8617; Undo</button><div class="log" id="log_shotsOnTarget"></div></div>

<div class="sec"><h2>Schuesse vorbei</h2>
<div class="rw"><span class="rc" id="hsb">0</span><button class="bh" type="button" onclick="c('hsb',1,'shotsOffTarget')">+</button><button class="ba" type="button" onclick="c('asb',1,'shotsOffTarget')">+</button><span class="rc" id="asb">0</span></div>
<button class="bu" type="button" onclick="uZ()">&#8617; Undo</button><div class="log" id="log_shotsOffTarget"></div></div>

<div class="sec"><h2>Ecken</h2>
<div class="rw"><span class="rc" id="he">0</span><button class="bh" type="button" onclick="c('he',0,'corners')">+</button><button class="ba" type="button" onclick="c('ae',0,'corners')">+</button><span class="rc" id="ae">0</span></div>
<button class="bu" type="button" onclick="uZ()">&#8617; Undo</button><div class="log" id="log_corners"></div></div>

<div class="sec"><h2>Freistoesse</h2>
<div class="rw"><span class="rc" id="hf">0</span><button class="bh" type="button" onclick="c('hf',0,'freeKicks')">+</button><button class="ba" type="button" onclick="c('af',0,'freeKicks')">+</button><span class="rc" id="af">0</span></div>
<button class="bu" type="button" onclick="uZ()">&#8617; Undo</button><div class="log" id="log_freeKicks"></div></div>

<div class="sec"><h2>Gelb</h2>
<div class="rw"><span class="rc" id="hy">0</span><button class="bh" type="button" onclick="c('hy',1,'yellow')">+</button><button class="ba" type="button" onclick="c('ay',1,'yellow')">+</button><span class="rc" id="ay">0</span></div>
<button class="bu" type="button" onclick="uZ()">&#8617; Undo</button><div class="log" id="log_yellow"></div></div>

<div class="sec"><h2>Rot</h2>
<div class="rw"><span class="rc" id="hr">0</span><button class="bh" type="button" onclick="c('hr',1,'red')">+</button><button class="ba" type="button" onclick="c('ar',1,'red')">+</button><span class="rc" id="ar">0</span></div>
<button class="bu" type="button" onclick="uZ()">&#8617; Undo</button><div class="log" id="log_red"></div></div>

<div class="sec"><h2>Elfmeter</h2>
<div class="rw"><span class="rc" id="hep">0</span><button class="bh" type="button" onclick="c('hep',1,'penalties')">+</button><button class="ba" type="button" onclick="c('aep',1,'penalties')">+</button><span class="rc" id="aep">0</span></div>
<button class="bu" type="button" onclick="uZ()">&#8617; Undo</button><div class="log" id="log_penalties"></div></div>

<div class="sec"><h2>Abseits</h2>
<div class="rw"><span class="rc" id="hab">0</span><button class="bh" type="button" onclick="c('hab',0,'offsides')">+</button><button class="ba" type="button" onclick="c('aab',0,'offsides')">+</button><span class="rc" id="aab">0</span></div>
<button class="bu" type="button" onclick="uZ()">&#8617; Undo</button><div class="log" id="log_offsides"></div></div>

<div class="sec"><h2>Fouls</h2>
<div class="rw"><span class="rc" id="hfo">0</span><button class="bh" type="button" onclick="c('hfo',1,'fouls')">+</button><button class="ba" type="button" onclick="c('afo',1,'fouls')">+</button><span class="rc" id="afo">0</span></div>
<button class="bu" type="button" onclick="uZ()">&#8617; Undo</button><div class="log" id="log_fouls"></div></div>

<div class="sec">
<button class="bx" type="button" onclick="rA()">Alles zuruecksetzen</button>
<button class="be" type="button" onclick="eC()">CSV Export</button>
</div>
</div>

<script>
var STORAGE_KEY = 'footballTrackerV12';
var mo='idle', tI=null, sec=0, hm=45, hn=1, nsS=0, h1T=0, h2T=0, h1NS=0, h2NS=0;
var runStartedAt=null, nsStartedAt=null;
var ALL=['hg','ag','hst','ast','hsb','asb','he','ae','hf','af','hy','ay','hr','ar','hep','aep','hab','aab','hfo','afo'];
var cs={}, hist=[], logs={
  goals:[], shotsOnTarget:[], shotsOffTarget:[], corners:[], freeKicks:[],
  yellow:[], red:[], penalties:[], offsides:[], fouls:[]
};
var categoryTitles={
  goals:'Tore',
  shotsOnTarget:'Schuesse aufs Tor',
  shotsOffTarget:'Schuesse vorbei',
  corners:'Ecken',
  freeKicks:'Freistoesse',
  yellow:'Gelb',
  red:'Rot',
  penalties:'Elfmeter',
  offsides:'Abseits',
  fouls:'Fouls'
};
for(var i=0;i<ALL.length;i++) cs[ALL[i]]=0;

function ft2(n){
  n = Math.max(0, Math.floor(n || 0));
  return String(Math.floor(n/60)).padStart(2,'0') + ':' + String(n%60).padStart(2,'0');
}
function homeName(){ return document.getElementById('tH').value || 'Heim'; }
function awayName(){ return document.getElementById('tAName').value || 'Auswaerts'; }
function isHome(id){ return id[0] === 'h'; }

function nowSec(){ return Math.floor(Date.now()/1000); }

function getRegElapsed(){
  if(mo==='run' && runStartedAt!==null){
    return sec + (nowSec() - runStartedAt);
  }
  return sec;
}
function getNsElapsed(){
  if(mo==='ns' && nsStartedAt!==null){
    return nsS + (nowSec() - nsStartedAt);
  }
  return nsS;
}
function getBaseTime(){
  var reg = (mo==='run') ? getRegElapsed() : sec;
  return hn === 1 ? reg : (hm * 60 + reg);
}
function getFixedBaseTime(){
  return hn === 1 ? hm * 60 : hm * 120;
}
function getDisplayTimeForEvent(){
  if(mo === 'ns') return ft2(getFixedBaseTime()) + ' [+] ' + ft2(getNsElapsed());
  return ft2(getBaseTime());
}

function applyColors(){
  var vH=document.getElementById('cH').value, vA=document.getElementById('cA').value;
  document.documentElement.style.setProperty('--hc', vH);
  document.documentElement.style.setProperty('--ac', vA);
  saveState();
}

function saveTeamNames(){ saveState(); }

function setButton(text, cls){
  var b=document.getElementById('btnStart');
  b.textContent=text;
  b.className=cls || '';
}

function renderLogs(){
  for(var key in logs){
    var el = document.getElementById('log_' + key);
    if(!el) continue;
    var html = '';
    for(var i=0;i<logs[key].length;i++){
      var item = logs[key][i];
      html += '<div class="logItem">' + item.t + ' - ' + item.team + (item.player ? ' #' + item.player : '') + '</div>';
    }
    el.innerHTML = html;
  }
}

function c(id, ask, category){
  refreshTimeState();
  cs[id]++;
  document.getElementById(id).textContent=cs[id];

  var record = {kind:'counter', id:id, category:category, logAdded:false};
  if(ask){
    var player = prompt('Spielernr. ' + (isHome(id)?'Heim':'Auswaerts') + ':');
    var entry = {
      t: getDisplayTimeForEvent(),
      team: isHome(id) ? homeName() : awayName(),
      player: player || ''
    };
    logs[category].push(entry);
    record.logAdded = true;
  }
  hist.push(record);
  renderLogs();
  saveState();
}

function uZ(){
  refreshTimeState();
  if(!hist.length) return;
  var last = hist.pop();
  if(last.kind === 'counter' && cs[last.id] > 0){
    cs[last.id]--;
    document.getElementById(last.id).textContent = cs[last.id];
    if(last.logAdded && logs[last.category].length){
      logs[last.category].pop();
    }
  }
  renderLogs();
  saveState();
}

function stopTicker(){
  if(tI){
    clearInterval(tI);
    tI=null;
  }
}

function refreshTimeState(){
  if(mo==='run' && runStartedAt!==null){
    sec = sec + (nowSec() - runStartedAt);
    runStartedAt = nowSec();
    if(sec >= hm*60){
      sec = hm*60;
    }
  }
  if(mo==='ns' && nsStartedAt!==null){
    nsS = nsS + (nowSec() - nsStartedAt);
    nsStartedAt = nowSec();
  }
}

function updateLabelAndButton(){
  if(mo==='idle'){
    document.getElementById('htLabel').textContent='1. Halbzeit';
    setButton('Start','');
  } else if(mo==='run'){
    document.getElementById('htLabel').textContent = hn === 1 ? '1. Halbzeit' : '2. Halbzeit';
    setButton('Stop','run');
  } else if(mo==='pau'){
    document.getElementById('htLabel').textContent = hn === 1 ? '1. Halbzeit pausiert' : '2. Halbzeit pausiert';
    setButton('Weiter','pau');
  } else if(mo==='ns'){
    document.getElementById('htLabel').textContent = hn === 1 ? 'Nachspielzeit 1. Halbzeit' : 'Nachspielzeit 2. Halbzeit';
    setButton('Nachspielzeit stoppen','ns');
  } else if(mo==='break'){
    document.getElementById('htLabel').textContent = 'Halbzeitpause';
    setButton('2. Halbzeit starten','next');
  } else if(mo==='done'){
    document.getElementById('htLabel').textContent = 'Spiel beendet';
    setButton('Beendet','done');
  }
}

function uT(){
  refreshTimeState();

  if(mo==='run' && sec >= hm*60){
    sec = hm*60;
    hE(true);
    return;
  }

  var tm=document.getElementById('timer');
  var nL=document.getElementById('nsLabel');

  if(mo==='idle'){
    tm.textContent='00:00';
    nL.textContent='';
  } else if(mo==='run' || mo==='pau'){
    tm.textContent = ft2(getBaseTime());
    nL.textContent = '';
  } else if(mo==='ns'){
    tm.textContent = ft2(getFixedBaseTime());
    nL.textContent = '[+] ' + ft2(getNsElapsed());
  } else if(mo==='break'){
    tm.textContent = ft2(hm * 60);
    nL.textContent = h1NS > 0 ? '[+] ' + ft2(h1NS) : '';
  } else if(mo==='done'){
    tm.textContent = ft2(hm * 120);
    nL.textContent = h2NS > 0 ? '[+] ' + ft2(h2NS) : '';
  }

  updateLabelAndButton();
}

function startUITicker(){
  stopTicker();
  if(mo==='run' || mo==='ns'){
    tI = setInterval(function(){ uT(); saveState(); }, 250);
  }
}

function hE(fromAuto){
  refreshTimeState();
  stopTicker();
  mo='ns';
  if(!fromAuto){
    nsS = 0;
  }
  nsStartedAt = nowSec();
  uT();
  startUITicker();
  saveState();
}

function finishPeriod(){
  refreshTimeState();
  stopTicker();

  if(mo==='ns' && nsStartedAt!==null){
    nsS = getNsElapsed();
    nsStartedAt = null;
  }

  if(hn === 1){
    h1T = hm * 60;
    h1NS = nsS;
    mo = 'break';
    sec = 0;
    nsS = 0;
  } else {
    h2T = hm * 60;
    h2NS = nsS;
    mo = 'done';
    nsS = h2NS;
  }
  uT();
  saveState();
}

function startHalf(halfNo){
  hn = halfNo;
  sec = 0;
  nsS = 0;
  runStartedAt = nowSec();
  nsStartedAt = null;
  mo = 'run';
  document.getElementById('tRow').classList.add('hd');
  uT();
  startUITicker();
  saveState();
}

function tA(){
  refreshTimeState();

  if(mo==='idle'){
    hm = parseInt(document.getElementById('hM').value, 10) || 45;
    if(hm < 1) hm = 45;
    document.getElementById('hM').value = hm;
    h1T=0; h2T=0; h1NS=0; h2NS=0;
    startHalf(1);
    return;
  }

  if(mo==='run'){
    sec = getRegElapsed();
    runStartedAt = null;
    mo='pau';
    uT();
    stopTicker();
    saveState();
    return;
  }

  if(mo==='pau'){
    runStartedAt = nowSec();
    mo='run';
    uT();
    startUITicker();
    saveState();
    return;
  }

  if(mo==='ns'){
    finishPeriod();
    return;
  }

  if(mo==='break'){
    startHalf(2);
    return;
  }
}

function eC(){
  refreshTimeState();
  var rows = [];
  rows.push(['Feld','Wert']);
  rows.push(['Heimteam', homeName()]);
  rows.push(['Auswaertsteam', awayName()]);
  rows.push(['Halbzeitminuten', hm]);
  rows.push(['1. Halbzeit regulaer', ft2(h1T)]);
  rows.push(['1. Halbzeit Nachspielzeit', ft2(h1NS)]);
  rows.push(['2. Halbzeit regulaer', ft2(h2T)]);
  rows.push(['2. Halbzeit Nachspielzeit', ft2(h2NS)]);
  for(var i=0;i<ALL.length;i++) rows.push([ALL[i], cs[ALL[i]]]);

  for(var cat in categoryTitles){
    rows.push(['', '']);
    rows.push([categoryTitles[cat], '']);
    for(var j=0;j<logs[cat].length;j++){
      var item = logs[cat][j];
      rows.push([item.t, item.team + (item.player ? ' #' + item.player : '')]);
    }
  }

  var csv = rows.map(function(r){
    return r.map(function(v){
      return '"' + String(v).replace(/"/g,'""') + '"';
    }).join(';');
  }).join('\n');

  var blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'football-tracker.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function rA(){
  stopTicker();
  mo='idle'; tI=null; sec=0; hm=45; hn=1; nsS=0; h1T=0; h2T=0; h1NS=0; h2NS=0;
  runStartedAt=null; nsStartedAt=null;
  hist=[];
  logs={goals:[], shotsOnTarget:[], shotsOffTarget:[], corners:[], freeKicks:[], yellow:[], red:[], penalties:[], offsides:[], fouls:[]};
  for(var i=0;i<ALL.length;i++){ cs[ALL[i]]=0; document.getElementById(ALL[i]).textContent='0'; }
  document.getElementById('hM').value='45';
  document.getElementById('tRow').classList.remove('hd');
  renderLogs();
  uT();
  saveState();
}

function saveState(){
  var state = {
    mo:mo, sec:sec, hm:hm, hn:hn, nsS:nsS, h1T:h1T, h2T:h2T, h1NS:h1NS, h2NS:h2NS,
    runStartedAt:runStartedAt, nsStartedAt:nsStartedAt,
    cs:cs, hist:hist, logs:logs,
    teamH:document.getElementById('tH').value,
    teamA:document.getElementById('tAName').value,
    colorH:document.getElementById('cH').value,
    colorA:document.getElementById('cA').value
  };
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(!raw) return;
  try {
    var s = JSON.parse(raw);
    mo = s.mo || 'idle';
    sec = s.sec || 0;
    hm = s.hm || 45;
    hn = s.hn || 1;
    nsS = s.nsS || 0;
    h1T = s.h1T || 0;
    h2T = s.h2T || 0;
    h1NS = s.h1NS || 0;
    h2NS = s.h2NS || 0;
    runStartedAt = s.runStartedAt == null ? null : s.runStartedAt;
    nsStartedAt = s.nsStartedAt == null ? null : s.nsStartedAt;

    if(s.cs) {
      for(var k in cs) if(s.cs.hasOwnProperty(k)) cs[k] = s.cs[k] || 0;
    }
    hist = Array.isArray(s.hist) ? s.hist : [];
    if(s.logs) logs = s.logs;

    document.getElementById('tH').value = s.teamH || '';
    document.getElementById('tAName').value = s.teamA || '';
    document.getElementById('cH').value = s.colorH || '#c2185b';
    document.getElementById('cA').value = s.colorA || '#1e88e5';
    document.getElementById('hM').value = hm;

    for(var i=0;i<ALL.length;i++) document.getElementById(ALL[i]).textContent = cs[ALL[i]];
    applyColors();
    renderLogs();

    if(mo !== 'idle') document.getElementById('tRow').classList.add('hd');
    else document.getElementById('tRow').classList.remove('hd');

    refreshTimeState();

    if(mo === 'run' && sec >= hm * 60) {
      sec = hm * 60;
      mo = 'ns';
      nsStartedAt = nowSec();
      nsS = Math.max(0, sec - hm * 60);
      sec = hm * 60;
    }
  } catch(e) {
    console.error(e);
  }
}

loadState();
uT();
startUITicker();
window.addEventListener('beforeunload', saveState);
document.addEventListener('visibilitychange', function(){ if(document.hidden) saveState(); });
</script>
</body>
</html>
