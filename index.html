 width:100%;padding:8px;margin:4px 0 8px;
 border:1px solid rgba(255,255,255,.12);

}

 width:60px!important;text-align:center;font-weight:700;
 font-size:1.2rem;background:rgba(255,255,255,.08)!important;
 border:none!important;
}

 display:inline-block;padding:2px 8px;border-radius:10px;
 font-size:.75rem;font-weight:600;
}

<body>

<h1>⚽ Spieltag Verwaltung</h1>

<div class="card">
  <h2>Spieltag erstellen</h2>
  <input id="stName" placeholder="Spieltag (z. B. 1)">
  <input type="date" id="stDatum">
  <input id="stLiga" placeholder="Liga (z. B. Kreisliga A)">
  <button class="btn btn-h" onclick="addSpieltag()">➕ Spieltag anlegen</button>
</div>

<div class="card">
  <h2>Mannschaften</h2>
  <div class="match-row">
    <input id="mH" placeholder="Heim">
    <input id="mA" placeholder="Auswärts">
    <button class="btn btn-a" onclick="addMatch()" style="width:auto;padding:8px 16px">+</button>
  </div>
  <div id="matchList"></div>
</div>

<div class="card" id="liveCard" style="display:none">
  <h2>🔴 Live Ergebnisse</h2>
  <div id="liveList"></div>
  <div style="margin-top:8px">
    <button class="btn btn-h" id="btnLive" onclick="toggleLive()">● Live starten</button>
  </div>
</div>

<div class="card">
  <h2>📤 Export / Import</h2>
  <div style="display:flex;gap:6px;flex-wrap:wrap">
    <button class="btn btn-a" onclick="exportExcel()" style="width:auto;flex:1">📊 Excel</button>
    <button class="btn btn-a" onclick="exportJSON()" style="width:auto;flex:1">💾 JSON</button>
    <button class="btn btn-a" onclick="$('importFile').click()" style="width:auto;flex:1">📂 Import</button>
  </div>
  <input type="file" id="importFile" accept=".json" style="display:none" onchange="importJSON(event)">
</div>

<div class="card">
  <h2>📋 Spieltage Übersicht</h2>
  <div id="stList"></div>
</div>

<script>
const $=id=>document.getElementById(id);
let spieltage=JSON.parse(localStorage.getItem('spieltage')||'[]');
let liveTimer=null, isLive=false, liveStIdx=-1;

function uid(){return Math.random().toString(36).slice(2,10)}
function save(){localStorage.setItem('spieltage',JSON.stringify(spieltage))}

function addSpieltag(){
 const n=$('stName').value.trim(), d=$('stDatum').value, l=$('stLiga').value.trim();
 if(!n)return alert('Spieltag Name eingeben!');
 spieltage.push({id:uid(),name:n,datum:d,liga:l,matches:[]});
 $('stName').value='';$('stDatum').value='';$('stLiga').value='';
 save();render();
}

function addMatch(){
 const h=$('mH').value.trim(), a=$('mA').value.trim();
 if(!h&&!a)return;
 let target=liveStIdx>=0?liveStIdx:spieltage.length-1;
 if(target
