<div class="sec"><h2>Tore</h2>
<div class="rw"><span class="rc" id="hg">0</span><button class="bh" onclick="c('hg',1)">+</button><button class="ba" onclick="c('ag',1)">+</button><span class="rc" id="ag">0</span></div>
<button class="bu" onclick="uZ()">&#8617; Undo</button><div class="gl" id="gl"></div></div>
<div class="sec"><h2>Schuesse aufs Tor</h2>
<div class="rw"><span class="rc" id="hst">0</span><button class="bh" onclick="c('hst',1)">+</button><button class="ba" onclick="c('ast',1)">+</button><span class="rc" id="ast">0</span></div>
<button class="bu" onclick="uZ()">&#8617; Undo</button></div>
<div class="sec"><h2>Schuesse vorbei</h2>
<div class="rw"><span class="rc" id="hsb">0</span><button class="bh" onclick="c('hsb',1)">+</button><button class="ba" onclick="c('asb',1)">+</button><span class="rc" id="asb">0</span></div>
<button class="bu" onclick="uZ()">&#8617; Undo</button></div>
<div class="sec"><h2>Ecken</h2>
<div class="rw"><span class="rc" id="he">0</span><button class="bh" onclick="c('he')">+</button><button class="ba" onclick="c('ae')">+</button><span class="rc" id="ae">0</span></div>
<button class="bu" onclick="uZ()">&#8617; Undo</button></div>
<div class="sec"><h2>Freistoesse</h2>
<div class="rw"><span class="rc" id="hf">0</span><button class="bh" onclick="c('hf')">+</button><button class="ba" onclick="c('af')">+</button><span class="rc" id="af">0</span></div>
<button class="bu" onclick="uZ()">&#8617; Undo</button></div>
<div class="sec"><h2>Gelb</h2>
<div class="rw"><span class="rc" id="hy">0</span><button class="bh" onclick="c('hy',1)">+</button><button class="ba" onclick="c('ay',1)">+</button><span class="rc" id="ay">0</span></div>
<button class="bu" onclick="uZ()">&#8617; Undo</button></div>
<div class="sec"><h2>Rot</h2>
<div class="rw"><span class="rc" id="hr">0</span><button class="bh" onclick="c('hr',1)">+</button><button class="ba" onclick="c('ar',1)">+</button><span class="rc" id="ar">0</span></div>
<button class="bu" onclick="uZ()">&#8617; Undo</button></div>
<div class="sec"><h2>Elfmeter</h2>
<div class="rw"><span class="rc" id="hep">0</span><button class="bh" onclick="c('hep',1)">+</button><button class="ba" onclick="c('aep',1)">+</button><span class="rc" id="aep">0</span></div>
<button class="bu" onclick="uZ()">&#8617; Undo</button></div>
<div class="sec"><h2>Abseits</h2>
<div class="rw"><span class="rc" id="hab">0</span><button class="bh" onclick="c('hab')">+</button><button class="ba" onclick="c('aab')">+</button><span class="rc" id="aab">0</span></div>
<button class="bu" onclick="uZ()">&#8617; Undo</button></div>
<div class="sec"><h2>Fouls</h2>
<div class="rw"><span class="rc" id="hfo">0</span><button class="bh" onclick="c('hfo',1)">+</button><button class="ba" onclick="c('afo',1)">+</button><span class="rc" id="afo">0</span></div>
<button class="bu" onclick="uZ()">&#8617; Undo</button></div>
<div class="sec">
<button class="bx" onclick="rA()">Alles zuruecksetzen</button>
<button class="be" onclick="eC()">CSV Export</button>
</div>
</div>
<script>
var mo='idle',tI=null,sec=0,hm=45,hn=1,nsR=false,nsS=0,h1T=0,h2T=0,h1NS=0,h2NS=0;
var ALL=['hg','ag','hst','ast','hsb','asb','he','ae','hf','af','hy','ay','hr','ar','hep','aep','hab','aab','hfo','afo'];
var cs={};for(var i=0;i<ALL.length;i++)cs[ALL[i]]=0;
var gl=[];
function ft(n){return String(Math.floor(n/3600)).padStart(2,'0')+':'+String(Math.floor((n%3600)/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');}
function ft2(n){return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');}
function hN(){return document.getElementById('tH').value||'Heim';}
function aN(){return document.getElementById('tA').value||'Auswaerts';}
function iH(id){return id[0]==='h';}
function tA(){
var b=document.getElementById('btnS'),l=document.getElementById('htLbl'),nL=document.getElementById('nsLbl'),tm=document.getElementById('timer');
if(mo==='idle'){
hm=parseInt(document.getElementById('hM').value)||30;if(hm<1)hm=30;
document.getElementById('hM').value=hm;sec=0;nsR=false;nsS=0;h1T=0;h2T=0;h1NS=0;h2NS=0;uT();
l.textContent=hn===1?'1. Halbzeit':'2. Halbzeit';nL.textContent='';mo='run';b.textContent='Stop';b.className='run';document.getElementById('tRow').classList.add('hd');
tI=setInterval(function(){sec++;uT();},1000);
}else if(mo==='run'){
clearInterval(tI);tI=null;mo='pau';b.textContent='Weiter';b.className='pau';
}else if(mo==='pau'){
mo='run';b.textContent='Stop';b.className='run';
tI=setInterval(function(){sec++;uT();},1000);
}else if(mo==='ns'){
mo='ht';nsR=false;clearInterval(tI);tI=null;
if(hn===1){b.textContent='2. Halbzeit starten';l.textContent='Halbzeit';nL.textContent='+ '+ft2(nsS);b.className='';b.style.background='#2e7d32';h1NS=nsS;}
else{b.textContent='Spiel beendet';l.textContent='Spiel beendet';nL.textContent='+ '+ft2(nsS);b.className='';b.style.background='#2e7d32';h2NS=nsS;}
}else if(mo==='ht'){
hn=2;nsS=0;sec=0;h2T=0;uT();l.textContent='2. Halbzeit';nL.textContent='';mo='run';b.textContent='Stop';b.className='run';document.getElementById('tRow').classList.add('hd');b.style.background='#e65100';
tI=setInterval(function(){sec++;uT();},1000);
}}
function hE(){
if(mo==='run'||mo==='pau'){clearInterval(tI);tI=null;}
mo='ns';nsR=true;nsS=0;
var b=document.getElementById('btnS'),l=document.getElementById('htLbl'),nL=document.getElementById('nsLbl');
b.textContent='Nachspielzeit stoppen';b.className='';b.style.background='#d32f2f';
l.textContent='Nachspielzeit';nL.textContent='+ 00:00';
tI=setInterval(function(){nsS++;uT();},1000);
}
function uT(){document.getElementById('timer').textContent=ft(sec);if(nsR)document.getElementById('nsLbl').textContent='+ '+ft2(nsS);}
function c(id,ask){
cs[id]++;document.getElementById(id).textContent=cs[id];
if(ask){
var nm=prompt('Spielernr. '+(iH(id)?'Heim':'Ausw')+':');
var tn=iH(id)?hN():aN();
gl.push({t:ft(sec),n:tn,c:cs[id],p:nm||'-'});rG();
}sV();
}
function uZ(){for(var i=ALL.length-1;i>=0;i--){var k=ALL[i];if(cs[k]>0){cs[k]--;document.getElementById(k).textContent=cs[k];if(k==='hg'||k==='ag'){gl.pop();rG();}sV();break;}}}
function rG(){var h='';for(var i=0;i<gl.length;i++){var g=gl[i];h+='<div class="gi">'+g.t+' - '+g.n+' #'+g.p+' ('+g.c+')</div>';}document.getElementById('gl').innerHTML=h;}
function sV(){try{localStorage.setItem('fc',JSON.stringify(cs));localStorage.setItem('fg',JSON.stringify(gl));localStorage.setItem('ft_hm',hm);localStorage.setItem('ft_hn',hn);localStorage.setItem('ft_h1T',h1T);localStorage.setItem('ft_h2T',h2T);localStorage.setItem('ft_h1NS',h1NS);localStorage.setItem('ft_h2NS',h2NS);}catch(e){}}
function sN(){try{localStorage.setItem('fh',document.getElementById('tH').value);localStorage.setItem('fa',document.getElementById('tA').value);}catch(e){}}
function sC(){aC();try{localStorage.setItem('fch',document.getElementById('cH').value);localStorage.setItem('fca',document.getElementById('cA').value);}catch(e){}}
function aC(){document.documentElement.style.setProperty('--hc',document.getElementById('cH').value);document.documentElement.style.setProperty('--ac',document.getElementById('cA').value);}
function rA(){if(!confirm('Wirklich alles zuruecksetzen?'))return;sec=0;hn=1;mo='idle';clearInterval(tI);tI=null;nsR=false;nsS=0;h1T=0;h2T=0;h1NS=0;h2NS=0;for(var i=0;i<ALL.length;i++)cs[ALL[i]]=0;gl=[];for(var i=0;i<ALL.length;i++)document.getElementById(ALL[i]).textContent='0';document.getElementById('timer').textContent='00:00';document.getElementById('htLbl').textContent='1. Halbzeit';document.getElementById('nsLbl').textContent='';var b=document.getElementById('btnS');b.textContent='Start';b.className='';b.style.background='#2e7d32';document.getElementById('tRow').classList.remove('hd');localStorage.clear();}
function eC(){
var hN=hN(),aN=aN();
var csv='Kategorie,'+hN+','+aN+'\n';
var L=[['Tore','hg','ag'],['Schuesse aufs Tor','hst','ast'],['Schuesse vorbei','hsb','asb'],['Ecken','he','ae'],['Freistoesse','hf','af'],['Gelb','hy','ay'],['Rot','hr','ar'],['Elfmeter','hep','aep'],['Abseits','hab','aab'],['Fouls','hfo','afo']];
for(var i=0;i<L.length;i++)csv+=L[i][0]+','+cs[L[i][1]]+','+cs[L[i][2]]+'\n';
csv+='\nSpielzeiten:\nH1,Dauer (MM:SS),'+ft2(h1T)+'\nH1,Nachspielzeit,'+ft2(h1NS)+'\nH2,Dauer,'+ft2(h2T)+'\nH2,Nachspielzeit,'+ft2(h2NS)+'\n\nTor-Protokoll:\nZeit,Team,Spieler,Tor-Nr\n';
for(var i=0;i<gl.length;i++){var g=gl[i];csv+=g.t+','+g.n+','+g.p+','+g.c+'\n';}
var bl=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'});var lnk=document.createElement('a');lnk.href=URL.createObjectURL(bl);var d=new Date();lnk.download='spiel_'+d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+'.csv';document.body.appendChild(lnk);lnk.click();document.body.removeChild(lnk);URL.revokeObjectURL(lnk.href);}
function load(){
try{
var sc=localStorage.getItem('fc');if(sc){cs=JSON.parse(sc);for(var k in cs){var el=document.getElementById(k);if(el)el.textContent=cs[k];}}
var sg=localStorage.getItem('fg');if(sg){gl=JSON.parse(sg);rG();}
var hh=localStorage.getItem('fh');if(hh)document.getElementById('tH').value=hh;
var an=localStorage.getItem('fa');if(an)document.getElementById('tA').value=an;
var ch=localStorage.getItem('fch');if(ch)document.getElementById('cH').value=ch;
var ca=localStorage.getItem('fca');if(ca)document.getElementById('cA').value=ca;
var savedHm=localStorage.getItem('ft_hm');if(savedHm){hm=parseInt(savedHm);document.getElementById('hM').value=hm;}
var savedHn=localStorage.getItem('ft_hn');if(savedHn){hn=parseInt(savedHn);}
// temps nicht übernehmen – startet neu
}catch(e){}aC();uD();}
function uD(){var h=hN(),a=aN();var eH=document.querySelectorAll('.lH');for(var i=0;i<eH.length;i++)eH[i].textContent=h;var eA=document.querySelectorAll('.lA');for(var i=0;i<eA.length;i++)eA[i].textContent=a;}
load();
</script>
</body>
</html>
